name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pitchmarket
          POSTGRES_PASSWORD: pitchmarket
          POSTGRES_DB: pitchmarket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pitchmarket"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pitchmarket:pitchmarket@localhost:5432/pitchmarket_test
      TEST_DATABASE_URL: postgres://pitchmarket:pitchmarket@localhost:5432/pitchmarket_test
      E2E_DATABASE_URL: postgres://pitchmarket:pitchmarket@localhost:5432/pitchmarket_e2e
      DATA_PROVIDER: fpl-archive
      SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - name: Create E2E database
        run: PGPASSWORD=pitchmarket psql -h localhost -U pitchmarket -d pitchmarket_test -c "CREATE DATABASE pitchmarket_e2e"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
